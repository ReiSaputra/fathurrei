<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="31" fill="#0c1a0f"/>
  <!-- Green border ring -->
  <circle cx="32" cy="32" r="30" stroke="#89d185" stroke-width="2.5" fill="none"/>
  <!-- Letter F using paths for crisp rendering -->
  <!-- Vertical stroke -->
  <rect x="20" y="15" width="5.5" height="34" rx="1" fill="#89d185"/>
  <!-- Top horizontal bar -->
  <rect x="20" y="15" width="22" height="5.5" rx="1" fill="#89d185"/>
  <!-- Middle horizontal bar -->
  <rect x="20" y="29" width="17" height="5" rx="1" fill="#89d185"/>
</svg>
